name: Release

on:
  release:
    types: [published]

jobs:
  verify:
    name: Verify release tag matches package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must equal package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "release tag v$TAG does not match package version $PKG"; exit 1; }
      - name: Run the CI smoke test against the release commit
        run: |
          node --check bin/deployer.mjs
          bash -n bin/serve.sh install/*.sh
