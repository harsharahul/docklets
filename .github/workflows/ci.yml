name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Syntax checks (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax-check deployer and shell scripts
        run: npm run check
      - name: Shellcheck
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          shellcheck -S warning bin/serve.sh bin/connector.sh bin/container-run.sh install/*.sh
      - name: Unit tests
        run: npm test

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Start gateway and converge examples
        run: |
          TESTROOT="$(mktemp -d)"
          chmod 755 "$TESTROOT"
          echo "TESTROOT=$TESTROOT" >> "$GITHUB_ENV"
          cp -R examples/guestbook examples/hello-static "$TESTROOT"/
          # A stand-in worker host on the gateway network: it echoes what the
          # gateway hands it, so the worker route can be checked end to end.
          docker network create dk-ci >/dev/null 2>&1 || true
          docker run -d --name dk-ci-wstub --network dk-ci node:20-alpine node -e '
            require("node:http").createServer((req, res) => {
              const pick = {}; for (const h of ["x-docklets-tenant","x-docklets-slug","x-docklets-prefix","authorization"]) pick[h] = req.headers[h] ?? null;
              let n = 0; req.on("data", (c) => n += c.length);
              req.on("end", () => { res.writeHead(200, {"content-type":"application/json","cache-control":"public, max-age=600"}); res.end(JSON.stringify({ url: req.url, headers: pick, bodyBytes: n })); });
            }).listen(9200, "0.0.0.0");'
          DOCKLETS_ROOT="$TESTROOT" DOCKLETS_PORT=8081 DOCKLETS_DETACH=1 DOCKLETS_WORKER_UPSTREAM=dk-ci-wstub:9200 \
            DOCKLETS_NETWORK=dk-ci DOCKLETS_GATEWAY=dk-ci-gw DOCKLETS_ACCESS=dk-ci-access ./bin/serve.sh
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8081/ && break; sleep 2
          done
          # Fail loudly with diagnostics if the gateway never answered.
          curl -sf -o /dev/null http://127.0.0.1:8081/ || {
            echo "::error::gateway did not answer on :8081"
            docker ps -a; docker logs dk-ci-gw 2>&1 | tail -30; exit 1
          }
          DOCKLETS_ROOT="$TESTROOT" DOCKLETS_NETWORK=dk-ci \
            DOCKLETS_GATEWAY=dk-ci-gw DOCKLETS_PREFIX=dk-ci- \
            node bin/deployer.mjs --once
      - name: Verify static asset
        run: |
          curl -sf http://127.0.0.1:8081/hello-static/ | grep -q "It works" || {
            echo "::error::static asset check failed"
            docker ps -a; docker logs dk-ci-gw 2>&1 | tail -30
            curl -v http://127.0.0.1:8081/hello-static/ || true; exit 1
          }
      - name: Verify the not-found page and its override
        run: |
          # A missing path must answer with the readable page, as HTML, and
          # a 404.html in the asset root must replace it.
          BODY="$(curl -s http://127.0.0.1:8081/no-such-path-xyz)"
          echo "$BODY" | grep -q "Nothing at this path" || {
            echo "::error::built-in not-found page missing"; echo "$BODY" | head -5; exit 1
          }
          curl -sI http://127.0.0.1:8081/no-such-path-xyz | grep -qi "content-type: text/html" || {
            echo "::error::not-found page is not served as HTML"; exit 1
          }
          printf '<h1>own page</h1>' > "$TESTROOT/404.html"
          curl -s http://127.0.0.1:8081/still-nothing | grep -q "own page" || {
            echo "::error::asset-root 404.html did not override the built-in page"; exit 1
          }
          rm -f "$TESTROOT/404.html"
      - name: Verify docklet API round-trip and persistence
        run: |
          # Wait on the API path: a file-server listing can never answer this,
          # so success proves the proxy route AND the app process are live.
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8081/guestbook/api/messages && break
            sleep 2
          done
          curl -sf -o /dev/null http://127.0.0.1:8081/guestbook/api/messages || {
            echo "::error::guestbook app never became reachable"
            docker ps -a
            docker logs dk-ci-guestbook 2>&1 | tail -20
            docker logs dk-ci-gw 2>&1 | tail -20
            exit 1
          }
          POST="$(curl -s -X POST http://127.0.0.1:8081/guestbook/api/messages \
            -H 'content-type: application/json' -d '{"text":"ci"}' \
            -w '\nHTTP_STATUS:%{http_code}')"
          echo "POST response: $POST"
          echo "$POST" | grep -q 'HTTP_STATUS:201' || {
            echo "::error::POST did not return 201"
            echo "app logs:";     docker logs dk-ci-guestbook 2>&1 | tail -20
            echo "gateway logs:"; docker logs dk-ci-gw 2>&1 | tail -10
            echo "/data inside the container:"
            docker exec dk-ci-guestbook ls -la /data
            docker exec dk-ci-guestbook sh -c 'touch /data/w-probe && echo "/data writable" || echo "/data NOT writable"'
            exit 1
          }
          GET="$(curl -sf http://127.0.0.1:8081/guestbook/api/messages)"
          echo "GET response: $GET"
          echo "$GET" | grep -q '"text":"ci"'
          echo "on-disk state:"
          cat "$TESTROOT/.data/guestbook/messages.json"
          grep -q '"text": "ci"' "$TESTROOT/.data/guestbook/messages.json"
      - name: Verify app container hardening
        run: |
          docker inspect dk-ci-guestbook \
            --format '{{.HostConfig.CapDrop}} {{.HostConfig.PortBindings}}' | \
            grep -q 'ALL.*map\[\]'
          docker inspect dk-ci-access \
            --format '{{.HostConfig.CapDrop}} {{.HostConfig.PortBindings}} ro={{.HostConfig.ReadonlyRootfs}}' | \
            grep -q 'ALL.*map\[\] ro=true'
      - name: Verify private docklets
        run: |
          B=http://127.0.0.1:8081
          fail() { echo "::error::$1"; docker logs dk-ci-access 2>&1 | tail -20; docker logs dk-ci-gw 2>&1 | tail -10; exit 1; }
          code() { curl -s -o /dev/null -w '%{http_code}' --path-as-is "$@"; }
          export DOCKLETS_ROOT="$TESTROOT"
          mkdir -p "$TESTROOT/secret" "$TESTROOT/echo"
          echo 'SECRET CONTENT' > "$TESTROOT/secret/index.html"
          printf '{ "runtime": "node", "entry": "server.js", "port": 3000 }\n' > "$TESTROOT/echo/app.json"
          cat > "$TESTROOT/echo/server.js" <<'JS'
          require('node:http').createServer((req, res) => {
            res.writeHead(200, { 'content-type': 'text/plain', 'cache-control': 'public, max-age=600' });
            res.end(`echo saw authorization=${req.headers.authorization ? 'present' : 'absent'} path=${req.url}`);
          }).listen(Number(process.env.PORT));
          JS
          LINK=$(node bin/access.mjs link secret | grep -o '#dkl_[A-Za-z0-9_-]*' | cut -c2-)
          printf 'correct horse battery\n' | node bin/access.mjs password secret
          ELINK=$(node bin/access.mjs link echo | grep -o '#dkl_[A-Za-z0-9_-]*' | cut -c2-)
          [ -n "$LINK" ] && [ -n "$ELINK" ] || fail "access CLI minted no links"
          DOCKLETS_NETWORK=dk-ci DOCKLETS_GATEWAY=dk-ci-gw DOCKLETS_PREFIX=dk-ci- \
            node bin/deployer.mjs --once
          for i in $(seq 1 30); do [ "$(code -H "Authorization: Bearer $ELINK" "$B/echo/")" = 200 ] && break; sleep 2; done

          # a browser page load goes to the login page; an API call gets 401
          H="$(curl -s -D - -o /dev/null -H 'Accept: text/html' "$B/secret/page.html")"
          echo "$H" | grep -q '^HTTP/1.1 303' || fail "private slug not redirected: $H"
          echo "$H" | grep -qi '^location: /.docklets/access/login?slug=secret&return=%2Fsecret%2Fpage.html' || fail "wrong login location: $H"
          echo "$H" | grep -qi '^cache-control: no-store' || fail "redirect is cacheable"
          [ "$(code -H 'Accept: application/json' "$B/secret/")" = 401 ] || fail "API request not 401"
          [ "$(code "$B/.docklets/access/login?slug=secret&return=%2Fsecret%2F")" = 200 ] || fail "login page"

          # a secret link and the password each open it; access.json is never served
          J="$RUNNER_TEMP/jar"
          curl -s -c "$J" -o /dev/null --data-urlencode slug=secret --data-urlencode "token=$LINK" \
            --data-urlencode return=/secret/ "$B/.docklets/access/redeem"
          [ "$(curl -s -b "$J" -D "$RUNNER_TEMP/h" "$B/secret/")" = "SECRET CONTENT" ] || fail "link cookie does not open the slug"
          grep -qi '^cache-control: private' "$RUNNER_TEMP/h" || fail "private content is shared-cacheable"
          [ "$(code -b "$J" "$B/secret/access.json")" = 404 ] || fail "access.json served to an unlocked visitor"
          [ "$(code -H 'Accept: text/html' "$B/secret/access.json")" = 404 ] || fail "access.json not refused"
          rm -f "$J"
          curl -s -c "$J" -o /dev/null --data-urlencode slug=secret --data-urlencode 'password=correct horse battery' \
            --data-urlencode return=/secret/ "$B/.docklets/access/unlock"
          [ "$(curl -s -b "$J" "$B/secret/")" = "SECRET CONTENT" ] || fail "password cookie does not open the slug"

          # no path form reaches private content without a credential
          for p in '//secret/' '/./secret/' '/x/../secret/' '/hello-static/../secret/' '/%2e/secret/' '/%2Fsecret/' '/hello-static%2F..%2Fsecret/'; do
            c="$(code "$B$p")"; b="$(curl -s --path-as-is "$B$p")"
            { [ "$c" = 400 ] || [ "$c" = 303 ]; } && [ "$b" != "SECRET CONTENT" ] || fail "bypass $p answered $c"
          done
          for p in '/%73ecret/' '/secret' '/secret%2Findex.html'; do
            [ "$(code -H 'Accept: text/html' "$B$p")" = 303 ] || fail "$p not locked"
          done
          [ "$(code -I -H 'Accept: text/html' "$B/secret/")" = 303 ] || fail "HEAD not locked"

          # a private app: a dkl_ bearer opens it and never reaches the app; other bearers do not open it
          [ "$(curl -s -H "Authorization: Bearer $ELINK" -D "$RUNNER_TEMP/h2" "$B/echo/x")" = "echo saw authorization=absent path=/x" ] \
            || fail "bearer link did not open the app, or reached it"
          grep -qi '^cache-control: private' "$RUNNER_TEMP/h2" || fail "app's public cache header not overridden"
          [ "$(code -H "Authorization: Bearer $ELINK" "$B/echo/access.json")" = 404 ] || fail "an app could serve its access.json"
          [ "$(code -H 'Authorization: Bearer app-own-token' -H 'Accept: application/json' "$B/echo/x")" = 401 ] || fail "non-link bearer opened a private app"
          [ "$(curl -s -H "Authorization: BEARER $ELINK" "$B/echo/y")" = "echo saw authorization=absent path=/y" ] || fail "upper-case BEARER token reached the app"
          if grep -q '"secret"' "$TESTROOT/.status.json"; then fail "status feed lists a private slug"; fi

          # app routes ignore case, so only an app's exact slug reaches it; static folders keep any name
          for p in '/Echo/x' '/ECHO/x' "/guestboo$(printf '\xe2\x84\xaa')/api/messages"; do
            [ "$(code -H 'Accept: text/html' -H "Authorization: Bearer $ELINK" "$B$p")" = 404 ] || fail "app case variant $p not refused"
          done
          [ "$(curl -s "$B/SECRET/")" != "SECRET CONTENT" ] || fail "case variant served a private slug"
          mkdir -p "$TESTROOT/My Notes" && echo NOTES > "$TESTROOT/My Notes/index.html"
          [ "$(curl -s "$B/My%20Notes/")" = "NOTES" ] || fail "a static folder with a capitalized name stopped serving"
          rm -rf "$TESTROOT/My Notes"
          [ "$(code -H 'Connection: Upgrade' -H 'Upgrade: websocket' "$B/hello-static/")" = 200 ] || fail "upgrade headers break the check"
          if curl -s -D - -o /dev/null "$B/hello-static/" | grep -qi '^cache-control: private'; then fail "public slug marked private"; fi
          # apps never reach the access service; the policy file's mode never matters to the decision
          docker exec dk-ci-echo node -e "fetch('http://dk-ci-access:9100/check?slug=secret').then(()=>process.exit(1),()=>process.exit(0))" \
            || fail "an app container reached the access service"
          chmod 600 "$TESTROOT/secret/access.json"
          [ "$(code -H 'Accept: text/html' "$B/secret/")" = 303 ] || fail "a 0600 access.json does not lock"
          [ "$(curl -s -b "$J" "$B/secret/")" = "SECRET CONTENT" ] || fail "a 0600 access.json does not open with a cookie"

          # without the access service, everything fails closed
          docker stop dk-ci-access >/dev/null
          [ "$(code "$B/hello-static/")" = 502 ] || fail "public slug did not fail closed"
          [ "$(code -b "$J" "$B/secret/")" = 502 ] || fail "private slug did not fail closed"
          docker start dk-ci-access >/dev/null
          for i in $(seq 1 15); do [ "$(code "$B/hello-static/")" = 200 ] && break; sleep 1; done
          rm -rf "$TESTROOT/secret" "$TESTROOT/echo" "$J"
          DOCKLETS_NETWORK=dk-ci DOCKLETS_GATEWAY=dk-ci-gw DOCKLETS_PREFIX=dk-ci- \
            node bin/deployer.mjs --once
      - name: Verify worker slugs route to the worker host
        run: |
          B=http://127.0.0.1:8081
          fail() { echo "::error::$1"; docker logs dk-ci-gw 2>&1 | tail -10; exit 1; }
          code() { curl -s -o /dev/null -w '%{http_code}' --path-as-is "$@"; }
          field() { node -pe 'const j=JSON.parse(require("fs").readFileSync(0,"utf8")); '"$1"; }
          export DOCKLETS_ROOT="$TESTROOT"
          mkdir -p "$TESTROOT/wk" "$TESTROOT/pw"
          printf '{ "runtime": "worker", "entry": "worker.js" }\n' > "$TESTROOT/wk/app.json"
          printf 'export default { fetch() { return new Response("x"); } };\n' > "$TESTROOT/wk/worker.js"
          printf 'SOURCE PAGE\n' > "$TESTROOT/wk/index.html"
          cp "$TESTROOT/wk/app.json" "$TESTROOT/wk/worker.js" "$TESTROOT/pw/"
          WLINK=$(node bin/access.mjs link pw | grep -o '#dkl_[A-Za-z0-9_-]*' | cut -c2-)
          DOCKLETS_NETWORK=dk-ci DOCKLETS_GATEWAY=dk-ci-gw DOCKLETS_PREFIX=dk-ci- node bin/deployer.mjs --once
          test -f "$TESTROOT/wk/.worker" || fail "the deployer did not mark the worker slug"
          # the slug reaches the worker host with its prefix stripped and named in headers; its files are never served
          [ "$(curl -s "$B/wk/api/x?q=1" | field 'j.url+" "+j.headers["x-docklets-slug"]+" "+j.headers["x-docklets-prefix"]')" = "/api/x?q=1 wk /wk" ] || fail "worker route did not reach the stand-in with the prefix stripped"
          if curl -s "$B/wk/" | grep -q 'SOURCE PAGE'; then fail "a worker slug served its files"; fi
          [ "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$B/wk")" = "308 $B/wk/" ] || fail "bare worker slug did not redirect"
          [ "$(code -H 'Accept: text/html' "$B/WK/x")" = 404 ] || fail "case variant of a worker slug not refused"
          [ "$(code "$B/hello-static/.worker")" = 404 ] || fail "the marker name is served"
          [ "$(curl -s -X POST --data-binary 'hello' "$B/wk/post" | field 'j.bodyBytes')" = 5 ] || fail "request body did not reach the worker host"
          # the access check runs in front of worker slugs exactly as for files
          [ "$(code -H 'Accept: text/html' "$B/pw/x")" = 303 ] || fail "private worker slug not sent to login"
          [ "$(code -H 'Accept: application/json' "$B/pw/x")" = 401 ] || fail "private worker slug API request not 401"
          [ "$(curl -s -D "$RUNNER_TEMP/wh" -H "Authorization: Bearer $WLINK" "$B/pw/x" | field 'j.url+" "+j.headers.authorization')" = "/x null" ] || fail "link bearer did not open the private worker, or reached it"
          grep -qi '^cache-control: private' "$RUNNER_TEMP/wh" || fail "private worker response is shared-cacheable"
          # without a worker host the slug answers the not-answering page, never its files
          docker stop dk-ci-wstub >/dev/null
          [ "$(code "$B/wk/x")" = 502 ] || fail "worker slug without a host is not 502"
          curl -s "$B/wk/x" | grep -q 'not answering' || fail "502 page is not the readable one"
          docker start dk-ci-wstub >/dev/null
          rm -rf "$TESTROOT/wk" "$TESTROOT/pw"
          DOCKLETS_NETWORK=dk-ci DOCKLETS_GATEWAY=dk-ci-gw DOCKLETS_PREFIX=dk-ci- node bin/deployer.mjs --once
      - name: Verify status feed and dashboard
        run: |
          test -f "$TESTROOT/.status.json"
          python3 - "$TESTROOT/.status.json" <<'EOF'
          import json, sys
          s = json.load(open(sys.argv[1]))
          apps = {a["slug"]: a for a in s["apps"]}
          assert apps["guestbook"]["state"] == "running", apps
          assert "hello-static" in s["static"], s
          for a in s["apps"]:
              assert set(a) <= {"slug", "state"}, f"public feed leaks fields: {a}"
          print("status feed OK:", s)
          EOF
          cp -R dashboard "$TESTROOT/status"
          sleep 1
          curl -sf http://127.0.0.1:8081/status/ | grep -q "docklets"
          curl -sf http://127.0.0.1:8081/.status.json | grep -q '"guestbook"'
          # root redirects to the dashboard, not a file listing. The target is
          # in the Location header (curl -w redirect_url), not the empty body.
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/)" = "302" ] \
            || { echo "::error::root is not a redirect"; exit 1; }
          LOC="$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:8081/)"
          echo "root Location: $LOC"
          case "$LOC" in */status/) ;; *) echo "::error::root does not point at /status/ (got $LOC)"; exit 1;; esac
          # following the redirect must land on the dashboard, and the redirect
          # body itself must not enumerate slugs
          curl -sL http://127.0.0.1:8081/ | grep -q "docklets" \
            || { echo "::error::followed root is not the dashboard"; exit 1; }
          if curl -s http://127.0.0.1:8081/ | grep -q 'guestbook'; then
            echo "::error::root still lists slugs"; exit 1
          fi
          # agent instruction files in the root are never served publicly
          sed -e "s|<ASSETS>|$TESTROOT|g" -e "s|<HOST>|http://127.0.0.1:8081|g" -e "s|<DOCKLETS>|$PWD|g" AGENTS.md | grep -v '^>' > "$TESTROOT/AGENTS.md"
          ln -s AGENTS.md "$TESTROOT/CLAUDE.md"
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/AGENTS.md)" = "404" ] \
            || { echo "::error::AGENTS.md publicly served"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/CLAUDE.md)" = "404" ] \
            || { echo "::error::CLAUDE.md publicly served"; exit 1; }
          grep -q "$TESTROOT" "$TESTROOT/AGENTS.md" || { echo "::error::AGENTS.md placeholders not filled"; exit 1; }
      - name: Verify admin plane security properties
        run: |
          DOCKLETS_ROOT="$TESTROOT" DOCKLETS_NETWORK=dk-ci \
            DOCKLETS_GATEWAY=dk-ci-gw DOCKLETS_PREFIX=dk-ci- \
            DOCKLETS_POLL_MS=1500 DOCKLETS_ADMIN_PORT=2020 \
            node bin/deployer.mjs > /tmp/admin-deployer.log 2>&1 &
          ADMIN_PID=$!
          for i in $(seq 1 15); do
            curl -s -o /dev/null http://127.0.0.1:2020/ && break; sleep 1
          done
          TOKEN="$(cat ~/.config/docklets/admin-token)"
          fail() { echo "::error::$1"; cat /tmp/admin-deployer.log; kill $ADMIN_PID; exit 1; }

          # UI served without auth, API refused without token
          curl -sf http://127.0.0.1:2020/ | grep -q "docklets admin" || fail "admin UI missing"
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2020/api/status)" = "401" ] || fail "unauthenticated status not 401"
          # DNS-rebinding defense: foreign Host header refused
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example:2020' http://127.0.0.1:2020/api/status)" = "403" ] || fail "foreign Host not 403"
          # no CORS grants
          curl -s -D - -o /dev/null -H "Authorization: Bearer $TOKEN" http://127.0.0.1:2020/api/status | grep -qi 'access-control-allow' && fail "CORS header present" || true
          # authenticated status
          curl -sf -H "Authorization: Bearer $TOKEN" http://127.0.0.1:2020/api/status | grep -q '"guestbook"' || fail "authed status missing app"
          # unknown slug 404, tail cap accepted
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" http://127.0.0.1:2020/api/logs/nope)" = "404" ] || fail "unknown slug not 404"
          curl -sf -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:2020/api/logs/guestbook?tail=99999" | grep -q '"logs"' || fail "logs endpoint failed"
          # pause removes the container on converge; resume restores it
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" http://127.0.0.1:2020/api/pause/guestbook | grep -q '"ok":true' || fail "pause failed"
          for i in $(seq 1 20); do
            docker ps --format '{{.Names}}' | grep -q '^dk-ci-guestbook$' || break; sleep 1
          done
          docker ps --format '{{.Names}}' | grep -q '^dk-ci-guestbook$' && fail "paused app still running"
          for i in $(seq 1 10); do
            grep -q '"state": "paused"' "$TESTROOT/.status.json" && break; sleep 1
          done
          grep -q '"state": "paused"' "$TESTROOT/.status.json" || fail "paused state not in status feed"
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" http://127.0.0.1:2020/api/resume/guestbook | grep -q '"ok":true' || fail "resume failed"
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8081/guestbook/api/messages && break; sleep 2
          done
          curl -sf http://127.0.0.1:8081/guestbook/api/messages | grep -q '"text":"ci"' || fail "data lost across pause/resume"
          kill $ADMIN_PID
      - name: Verify tunnel connector end to end against a stock frp server
        run: |
          T="$(mktemp -d)"
          # the connector works with any frp server: test against the pinned
          # upstream frps release, checksum-verified
          FRP_VERSION=0.71.0
          SHA=84f27e39f11169f7adcef8e8b70c9329de17747b1f14dad9fb95eef5682ea716
          curl -fsSL -o /tmp/frp.tgz "https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/frp_${FRP_VERSION}_linux_amd64.tar.gz"
          echo "$SHA  /tmp/frp.tgz" | sha256sum -c -
          tar -xzf /tmp/frp.tgz -C /tmp "frp_${FRP_VERSION}_linux_amd64/frps"
          printf 'bindPort = 7000\nvhostHTTPPort = 8080\nsubdomainHost = "docklets.test"\nauth.method = "token"\nauth.token = "ci-token"\n' > /tmp/frps.toml
          "/tmp/frp_${FRP_VERSION}_linux_amd64/frps" -c /tmp/frps.toml > /tmp/frps.log 2>&1 &
          for i in $(seq 1 15); do
            (echo > /dev/tcp/127.0.0.1/7000) 2>/dev/null && break; sleep 1
          done
          # guard: refuses to tunnel the admin plane
          mkdir -p "$T/conf"
          printf 'TUNNEL_SERVER=127.0.0.1\nTUNNEL_PORT=7000\nTUNNEL_TOKEN=ci-token\nTUNNEL_NAME=ci-tenant\nLOCAL_PORT=2020\n' > "$T/conf/bad.env"
          if DOCKLETS_CONNECTOR_CONFIG="$T/conf/bad.env" DOCKLETS_CONNECTOR_HOME="$T/conf" ./bin/connector.sh 2>/dev/null; then
            echo "::error::connector tunneled the admin port"; exit 1
          fi
          # real tunnel to the smoke-test gateway on :8081
          printf 'TUNNEL_SERVER=127.0.0.1\nTUNNEL_PORT=7000\nTUNNEL_TOKEN=ci-token\nTUNNEL_NAME=ci-tenant\nLOCAL_PORT=8081\n' > "$T/conf/good.env"
          DOCKLETS_CONNECTOR_CONFIG="$T/conf/good.env" DOCKLETS_CONNECTOR_HOME="$T/conf" ./bin/connector.sh > "$T/connector.log" 2>&1 &
          for i in $(seq 1 20); do grep -q "start proxy success" "$T/connector.log" && break; sleep 1; done
          grep -q "start proxy success" "$T/connector.log" || { echo "::error::tunnel never established"; cat "$T/connector.log"; exit 1; }
          curl -sf -H "Host: ci-tenant.docklets.test" http://127.0.0.1:8080/hello-static/ | grep -q "It works" \
            || { echo "::error::static asset not served through tunnel"; exit 1; }
          curl -sf -H "Host: ci-tenant.docklets.test" http://127.0.0.1:8080/guestbook/api/messages > /dev/null \
            || { echo "::error::docklet API not served through tunnel"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: nobody.docklets.test' http://127.0.0.1:8080/)" = "404" ] \
            || { echo "::error::unknown tenant not 404"; exit 1; }
          # managed-edge auth: user + token metadata (managed deployments
          # validate these in an edge-side plugin; a bare frps accepts the
          # login and namespaces the proxy under the user)
          printf 'bindPort = 17001\nvhostHTTPPort = 17080\nsubdomainHost = "docklets.test"\n' > /tmp/frps-managed.toml
          "/tmp/frp_${FRP_VERSION}_linux_amd64/frps" -c /tmp/frps-managed.toml > /tmp/frps-managed.log 2>&1 &
          for i in $(seq 1 15); do
            (echo > /dev/tcp/127.0.0.1/17001) 2>/dev/null && break; sleep 1
          done
          printf 'TUNNEL_SERVER=127.0.0.1\nTUNNEL_PORT=17001\nTUNNEL_TOKEN=ci-token\nTUNNEL_NAME=ci-user\nTUNNEL_USER=ci-user\nLOCAL_PORT=8081\n' > "$T/conf/managed.env"
          DOCKLETS_CONNECTOR_CONFIG="$T/conf/managed.env" DOCKLETS_CONNECTOR_HOME="$T/conf" ./bin/connector.sh > "$T/managed.log" 2>&1 &
          for i in $(seq 1 20); do grep -q "start proxy success" "$T/managed.log" && break; sleep 1; done
          grep -q "start proxy success" "$T/managed.log" \
            || { echo "::error::managed-mode tunnel never established"; cat "$T/managed.log"; exit 1; }
          curl -sf -H "Host: ci-user.docklets.test" http://127.0.0.1:17080/hello-static/ | grep -q "It works" \
            || { echo "::error::managed-mode round-trip failed"; exit 1; }
          grep -q 'user = "ci-user"' "$T/conf/frpc.generated.toml"
          grep -q 'metadatas.token = "ci-token"' "$T/conf/frpc.generated.toml"
          if grep -q 'auth.token' "$T/conf/frpc.generated.toml"; then
            echo "::error::managed mode leaked auth.token"; exit 1
          fi
          pkill -f 'frps -c /tmp/frps-managed.toml' || true
      - name: Verify wss transport through a TLS-terminating proxy
        run: |
          T="$(mktemp -d)"; mkdir -p "$T/conf" "$T/wss"
          # caddy stands in for any TLS-terminating HTTPS proxy in front of frps
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
            -keyout "$T/wss/key.pem" -out "$T/wss/cert.pem" -days 2 -nodes \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          cat > "$T/wss/Caddyfile" <<'EOF'
          {
            auto_https off
            admin off
          }
          :8443 {
            tls /etc/caddy/cert.pem /etc/caddy/key.pem
            reverse_proxy 127.0.0.1:7000
          }
          EOF
          chmod -R a+r "$T/wss"
          docker run -d --name dk-ci-wssproxy --network host \
            -v "$T/wss:/etc/caddy:ro" caddy:2.11-alpine caddy run --config /etc/caddy/Caddyfile
          for i in $(seq 1 15); do
            (echo > /dev/tcp/127.0.0.1/8443) 2>/dev/null && break; sleep 1
          done
          # without a CA that trusts the proxy, the connector must refuse
          printf 'TUNNEL_SERVER=localhost\nTUNNEL_PORT=8443\nTUNNEL_TOKEN=ci-token\nTUNNEL_NAME=ci-wss\nLOCAL_PORT=8081\nTUNNEL_PROTOCOL=wss\n' > "$T/conf/wss-noca.env"
          DOCKLETS_CONNECTOR_CONFIG="$T/conf/wss-noca.env" DOCKLETS_CONNECTOR_HOME="$T/conf" ./bin/connector.sh > "$T/wss-noca.log" 2>&1 &
          NOCA=$!; sleep 10; kill $NOCA 2>/dev/null || true
          grep -q "certificate signed by unknown authority" "$T/wss-noca.log" \
            || { echo "::error::expected certificate refusal is missing"; cat "$T/wss-noca.log"; exit 1; }
          if grep -q "start proxy success" "$T/wss-noca.log"; then
            echo "::error::wss connected without trust"; exit 1
          fi
          # pinning the proxy certificate as CA establishes and carries traffic
          printf 'TUNNEL_SERVER=localhost\nTUNNEL_PORT=8443\nTUNNEL_TOKEN=ci-token\nTUNNEL_NAME=ci-wss\nLOCAL_PORT=8081\nTUNNEL_PROTOCOL=wss\n' > "$T/conf/wss.env"
          echo "TUNNEL_CA_FILE=$T/wss/cert.pem" >> "$T/conf/wss.env"
          DOCKLETS_CONNECTOR_CONFIG="$T/conf/wss.env" DOCKLETS_CONNECTOR_HOME="$T/conf" ./bin/connector.sh > "$T/wss.log" 2>&1 &
          for i in $(seq 1 20); do grep -q "start proxy success" "$T/wss.log" && break; sleep 1; done
          grep -q "start proxy success" "$T/wss.log" \
            || { echo "::error::wss tunnel never established"; cat "$T/wss.log"; docker logs dk-ci-wssproxy; exit 1; }
          curl -sf -H "Host: ci-wss.docklets.test" http://127.0.0.1:8080/hello-static/ | grep -q "It works" \
            || { echo "::error::static asset not served through wss tunnel"; exit 1; }
          docker rm -f dk-ci-wssproxy
          pkill -f 'frps -c /tmp/frps.toml' || true
      - name: Verify removal lifecycle
        run: |
          rm "$TESTROOT/guestbook/app.json"
          DOCKLETS_ROOT="$TESTROOT" DOCKLETS_NETWORK=dk-ci \
            DOCKLETS_GATEWAY=dk-ci-gw DOCKLETS_PREFIX=dk-ci- \
            node bin/deployer.mjs --once
          if docker ps -a --format '{{.Names}}' | grep -q '^dk-ci-guestbook$'; then
            echo "container should have been removed" && exit 1
          fi
      - name: Teardown
        if: always()
        run: |
          docker rm -f dk-ci-gw dk-ci-access dk-ci-wstub 2>/dev/null || true
          docker ps -aq --filter label=docklet | xargs -r docker rm -f
          docker network rm dk-ci dk-ci-access 2>/dev/null || true

  hosted:
    name: Hosted stack end to end
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build the image
        run: docker build -t dk-ci-hosted .
      - name: Start the simulated pod (runtime + caddy sharing localhost)
        run: |
          HR="$(mktemp -d)" && chmod 777 "$HR"
          echo "HR=$HR" >> "$GITHUB_ENV"
          TOKEN="dk-ci-sync-$(head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
          node bin/receiver.mjs --hash "$TOKEN" > /tmp/sync-hash
          # a second writer holds its own token in an extra hash file
          AGENT_TOKEN="dk-ci-agent-$(head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "AGENT_TOKEN=$AGENT_TOKEN" >> "$GITHUB_ENV"
          node bin/receiver.mjs --hash "$AGENT_TOKEN" > /tmp/agent-hash
          # frps on the runner is the edge; the runtime container dials it.
          FRP_VERSION=0.71.0
          SHA=84f27e39f11169f7adcef8e8b70c9329de17747b1f14dad9fb95eef5682ea716
          curl -fsSL -o /tmp/frp.tgz "https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/frp_${FRP_VERSION}_linux_amd64.tar.gz"
          echo "$SHA  /tmp/frp.tgz" | sha256sum -c -
          tar -xzf /tmp/frp.tgz -C /tmp "frp_${FRP_VERSION}_linux_amd64/frps"
          printf 'bindPort = 7000\nvhostHTTPPort = 8090\nsubdomainHost = "docklets.test"\nauth.method = "token"\nauth.token = "ci-token"\n' > /tmp/frps.toml
          "/tmp/frp_${FRP_VERSION}_linux_amd64/frps" -c /tmp/frps.toml > /tmp/frps.log 2>&1 &
          printf 'TUNNEL_SERVER=dk-ci-host\nTUNNEL_PORT=7000\nTUNNEL_TOKEN=ci-token\nTUNNEL_NAME=hosted-ci\nLOCAL_PORT=8080\n' > /tmp/connector.env
          # the gateway's routes dir exists before the runtime starts, writable by
          # the runtime too (its access service keeps its key beside the routes)
          mkdir -p "$HR/.gateway/routes" && chmod 777 "$HR/.gateway"
          printf '# placeholder so the routes glob always matches\n' > "$HR/.gateway/routes/00-placeholder.caddy"
          docker run -d --name dk-ci-rt \
            --add-host dk-ci-host:host-gateway \
            -p 127.0.0.1:19000:9000 \
            -v "$HR":/folder \
            -v /tmp/sync-hash:/etc/docklets/sync-hash:ro \
            -v /tmp/agent-hash:/etc/docklets/agent-hash:ro \
            -v /tmp/connector.env:/etc/docklets/connector.env:ro \
            -e DOCKLETS_ROOT=/folder \
            -e DOCKLETS_SYNC_TOKEN_HASH_FILE=/etc/docklets/sync-hash \
            -e DOCKLETS_SYNC_TOKEN_HASH_FILES=/etc/docklets/agent-hash \
            dk-ci-hosted
          docker run -d --name dk-ci-pod-gw --network container:dk-ci-rt \
            -v "$HR":/srv:ro \
            -v "$PWD/gateway/Caddyfile":/etc/caddy/Caddyfile:ro \
            -v "$HR/.gateway/routes":/etc/caddy/routes:ro \
            --read-only --tmpfs /tmp --tmpfs /data --tmpfs /config \
            caddy:2.11-alpine
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:19000/healthz && break; sleep 1
          done
          curl -sf http://127.0.0.1:19000/healthz || { docker logs dk-ci-rt; exit 1; }
      - name: Sync a folder and serve it through the tunnel
        run: |
          L="$(mktemp -d)"
          cp -R examples/hello-static "$L/hello-static"
          printf 'hosted note\n' > "$L/note.txt"
          DOCKLETS_SYNC_URL=http://127.0.0.1:19000 DOCKLETS_SYNC_TOKEN="$TOKEN" \
            node bin/sync.mjs "$L"
          for i in $(seq 1 20); do
            curl -sf -H "Host: hosted-ci.docklets.test" http://127.0.0.1:8090/hello-static/ | grep -q "It works" && break
            sleep 2
          done
          curl -sf -H "Host: hosted-ci.docklets.test" http://127.0.0.1:8090/hello-static/ | grep -q "It works" \
            || { echo "::error::synced content not served through the tunnel"; docker logs dk-ci-rt; cat /tmp/frps.log; exit 1; }
          curl -sf -H "Host: hosted-ci.docklets.test" http://127.0.0.1:8090/note.txt | grep -q "hosted note"
          # the second writer's token reads the live tree back through the new endpoints
          curl -sf -H "Authorization: Bearer $AGENT_TOKEN" http://127.0.0.1:19000/sync/manifest \
            | grep -q '"hello-static/index.html"' \
            || { echo "::error::manifest missing the synced file"; exit 1; }
          [ "$(curl -sf -H "Authorization: Bearer $AGENT_TOKEN" 'http://127.0.0.1:19000/sync/file?path=note.txt')" = "hosted note" ] \
            || { echo "::error::file read did not return the synced bytes"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $AGENT_TOKEN" 'http://127.0.0.1:19000/sync/file?path=.status.json')" = "400" ] \
            || { echo "::error::dot-entry was readable"; exit 1; }
          # the seeded dashboard answers, and the status feed marks app folders pending
          curl -sf -H "Host: hosted-ci.docklets.test" http://127.0.0.1:8090/status/ | grep -q docklets
          # a private slug synced into the pod locks through the pod's own access service
          mkdir "$L/draft" && echo 'DRAFT' > "$L/draft/index.html"
          DLINK="$(DOCKLETS_ROOT="$L" node bin/access.mjs link draft | grep -o '#dkl_[A-Za-z0-9_-]*' | cut -c2-)"
          DOCKLETS_SYNC_URL=http://127.0.0.1:19000 DOCKLETS_SYNC_TOKEN="$TOKEN" node bin/sync.mjs "$L"
          H="$(curl -s -D - -o /dev/null -H 'Host: hosted-ci.docklets.test' -H 'Accept: text/html' http://127.0.0.1:8090/draft/)"
          echo "$H" | grep -q '^HTTP/1.1 303' \
            || { echo "::error::synced private slug not locked: $H"; docker logs dk-ci-rt 2>&1 | tail -20; exit 1; }
          [ "$(curl -s -H 'Host: hosted-ci.docklets.test' -H "Authorization: Bearer $DLINK" http://127.0.0.1:8090/draft/)" = "DRAFT" ] \
            || { echo "::error::a link token does not open the synced private slug"; exit 1; }
          mkdir "$L/my-app"
          printf '{"runtime":"node","entry":"s.js","port":3000}' > "$L/my-app/app.json"
          printf '// app\n' > "$L/my-app/s.js"
          DOCKLETS_SYNC_URL=http://127.0.0.1:19000 DOCKLETS_SYNC_TOKEN="$TOKEN" \
            node bin/sync.mjs "$L"
          for i in $(seq 1 15); do
            curl -s -H "Host: hosted-ci.docklets.test" http://127.0.0.1:8090/.status.json | grep -q '"pending"' && break
            sleep 2
          done
          curl -s -H "Host: hosted-ci.docklets.test" http://127.0.0.1:8090/.status.json | grep -q '"pending"' \
            || { echo "::error::app folder not reported pending"; exit 1; }
          # mirror delete propagates
          rm "$L/note.txt"
          DOCKLETS_SYNC_URL=http://127.0.0.1:19000 DOCKLETS_SYNC_TOKEN="$TOKEN" \
            node bin/sync.mjs "$L"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: hosted-ci.docklets.test' http://127.0.0.1:8090/note.txt)" = "404" ] \
            || { echo "::error::deleted file still served"; exit 1; }
          # a synced worker slug is marked by the receiver and routed by the
          # gateway (no worker host here: the readable 502), never served as files
          mkdir "$L/wk"
          printf '{"runtime":"worker","entry":"worker.js"}' > "$L/wk/app.json"
          printf '// w\n' > "$L/wk/worker.js"
          printf 'SOURCE PAGE\n' > "$L/wk/index.html"
          DOCKLETS_SYNC_URL=http://127.0.0.1:19000 DOCKLETS_SYNC_TOKEN="$TOKEN" node bin/sync.mjs "$L"
          test -f "$HR/wk/.worker" || { echo "::error::receiver did not mark the worker slug"; docker logs dk-ci-rt 2>&1 | tail -10; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: hosted-ci.docklets.test' http://127.0.0.1:8090/wk/)" = "502" ] \
            || { echo "::error::worker slug without a host is not 502"; exit 1; }
          if curl -s -H 'Host: hosted-ci.docklets.test' http://127.0.0.1:8090/wk/ | grep -q 'SOURCE PAGE'; then echo "::error::worker slug served its files"; exit 1; fi
          for i in $(seq 1 15); do
            curl -s -H "Host: hosted-ci.docklets.test" http://127.0.0.1:8090/.status.json | grep -q '"wk"' && break; sleep 2
          done
          curl -s -H "Host: hosted-ci.docklets.test" http://127.0.0.1:8090/.status.json | grep -q '"wk"' \
            || { echo "::error::worker slug missing from the status feed"; exit 1; }
      - name: Serve two tenants from one cell (receiver and access per tenant, root per host)
        run: |
          C="$(mktemp -d)" && mkdir -p "$C/srv" "$C/hashes" "$C/routes" && chmod 777 "$C/srv"
          printf '# placeholder\n' > "$C/routes/00-placeholder.caddy"
          TA="dksync-alpha-$(head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          TB="dksync-bravo-$(head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          node bin/receiver.mjs --hash "$TA" > "$C/hashes/alpha-site"
          node bin/receiver.mjs --hash "$TB" > "$C/hashes/bravo-site"
          docker network create dk-ci-cellnet >/dev/null
          docker run -d --name dk-ci-cellstub --network dk-ci-cellnet node:20-alpine node -e '
            require("node:http").createServer((req, res) => { res.writeHead(200, {"content-type":"application/json"}); res.end(JSON.stringify({ url: req.url, tenant: req.headers["x-docklets-tenant"], slug: req.headers["x-docklets-slug"] })); }).listen(9200, "0.0.0.0");'
          docker run -d --name dk-ci-cell --network dk-ci-cellnet -p 127.0.0.1:19100:9000 -p 127.0.0.1:18096:8080 \
            -e DOCKLETS_CELL=1 -e DOCKLETS_ROOT=/srv -e DOCKLETS_SYNC_HASH_DIR=/etc/docklets/hashes \
            -v "$C/srv":/srv -v "$C/hashes":/etc/docklets/hashes:ro dk-ci-hosted
          docker run -d --name dk-ci-cell-gw --network container:dk-ci-cell \
            -e 'DOCKLETS_CADDY_ROOT=/srv/{http.request.host.labels.2}' \
            -e 'DOCKLETS_HOST_GUARD=^[a-z0-9-]+\.docklets\.test(:[0-9]+)?$' \
            -e DOCKLETS_WORKER_UPSTREAM=dk-ci-cellstub:9200 \
            -v "$C/srv":/srv:ro -v "$PWD/gateway/Caddyfile":/etc/caddy/Caddyfile:ro -v "$C/routes":/etc/caddy/routes:ro \
            --read-only --tmpfs /tmp --tmpfs /data --tmpfs /config caddy:2.11-alpine
          B=http://127.0.0.1:18096; R=http://127.0.0.1:19100
          for i in $(seq 1 30); do curl -sf -o /dev/null $R/healthz && break; sleep 1; done
          fail() { echo "::error::$1"; docker logs dk-ci-cell 2>&1 | tail -20; docker logs dk-ci-cell-gw 2>&1 | tail -10; exit 1; }
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          HA=(-H 'Host: alpha-site.docklets.test'); HB=(-H 'Host: bravo-site.docklets.test')
          curl -s $R/healthz | grep -q '"cell"' || fail "the receiver does not advertise cell mode"
          # alpha: hello, a private draft, a worker slug; bravo: hello, its own private draft, open
          mkdir -p "$C/la/draft" "$C/la/hello" "$C/la/api" "$C/lb/draft" "$C/lb/hello" "$C/lb/open"
          echo 'ALPHA DRAFT' > "$C/la/draft/index.html"; echo 'ALPHA HELLO' > "$C/la/hello/index.html"
          printf '{"runtime":"worker","entry":"worker.js"}' > "$C/la/api/app.json"; printf '//\n' > "$C/la/api/worker.js"
          echo 'BRAVO DRAFT' > "$C/lb/draft/index.html"; echo 'BRAVO HELLO' > "$C/lb/hello/index.html"; echo 'BRAVO OPEN' > "$C/lb/open/index.html"
          LA="$(DOCKLETS_ROOT="$C/la" node bin/access.mjs link draft | grep -o '#dkl_[A-Za-z0-9_-]*' | cut -c2-)"
          LB="$(DOCKLETS_ROOT="$C/lb" node bin/access.mjs link draft | grep -o '#dkl_[A-Za-z0-9_-]*' | cut -c2-)"
          DOCKLETS_SYNC_URL=$R DOCKLETS_SYNC_TOKEN="$TA" DOCKLETS_SYNC_TENANT=alpha-site node bin/sync.mjs "$C/la" || fail "alpha sync failed"
          DOCKLETS_SYNC_URL=$R DOCKLETS_SYNC_TOKEN="$TB" DOCKLETS_SYNC_TENANT=bravo-site node bin/sync.mjs "$C/lb" || fail "bravo sync failed"
          if DOCKLETS_SYNC_URL=$R DOCKLETS_SYNC_TOKEN="$TA" DOCKLETS_SYNC_TENANT=bravo-site node bin/sync.mjs "$C/la" 2>/dev/null; then fail "alpha's token wrote bravo's folder"; fi
          [ "$(curl -s "${HA[@]}" $B/hello/)" = "ALPHA HELLO" ] || fail "alpha host did not serve alpha's folder"
          [ "$(curl -s "${HB[@]}" $B/hello/)" = "BRAVO HELLO" ] || fail "bravo host did not serve bravo's folder"
          [ "$(code "${HA[@]}" $B/open/)" = 404 ] || fail "a bravo-only slug answered on alpha"
          # any host the cell does not serve finds nothing, a deeper subdomain of a tenant included
          [ "$(code -H 'Host: evil.alpha-site.docklets.test' $B/hello/)" = 404 ] || fail "a deeper host reached alpha's folder"
          [ "$(code -H 'Host: alpha-site.example.org' $B/hello/)" = 404 ] || fail "a foreign host reached alpha's folder"
          [ "$(code -H 'Host: alpha-site.example.org' $B/)" = 404 ] || fail "a foreign host got the root redirect"
          # private docklets stay per tenant: links, cookies, and keys
          [ "$(code "${HA[@]}" -H 'Accept: text/html' $B/draft/)" = 303 ] || fail "alpha's draft did not send a browser to login"
          [ "$(curl -s "${HA[@]}" -H "Authorization: Bearer $LA" $B/draft/)" = "ALPHA DRAFT" ] || fail "alpha's link did not open alpha's draft"
          [ "$(code "${HB[@]}" -H "Authorization: Bearer $LA" -H 'Accept: application/json' $B/draft/)" = 401 ] || fail "alpha's link opened bravo's draft"
          [ "$(curl -s "${HB[@]}" -H "Authorization: Bearer $LB" $B/draft/)" = "BRAVO DRAFT" ] || fail "bravo's link did not open bravo's draft"
          CK="$(curl -s -D - -o /dev/null "${HA[@]}" --data-urlencode slug=draft --data-urlencode "token=$LA" --data-urlencode return=/draft/ $B/.docklets/access/redeem | grep -i '^set-cookie' | sed -E 's/^[Ss]et-[Cc]ookie: ([^;]+);.*/\1/' | tr -d '\r')"
          [ "$(curl -s -H "Cookie: $CK" "${HA[@]}" $B/draft/)" = "ALPHA DRAFT" ] || fail "a redeemed cookie did not open alpha's draft"
          [ "$(code -H "Cookie: $CK" "${HB[@]}" -H 'Accept: text/html' $B/draft/)" = 303 ] || fail "alpha's cookie opened bravo's draft"
          docker exec dk-ci-cell sh -c 'cmp -s /srv/alpha-site/.gateway/access-key /srv/bravo-site/.gateway/access-key' && fail "two tenants share a cookie key"
          # worker slugs route with the tenant taken from the host
          [ "$(curl -s "${HA[@]}" $B/api/x | node -pe 'const j=JSON.parse(require("fs").readFileSync(0,"utf8")); j.url+" "+j.tenant+" "+j.slug')" = "/x alpha-site api" ] || fail "worker slug did not route with its tenant"
          [ "$(code "${HB[@]}" $B/api/x)" = 404 ] || fail "alpha's worker slug answered on bravo"
          # each tenant has its own dashboard and status feed
          curl -s "${HA[@]}" $B/status/ | grep -q docklets || fail "no per-tenant dashboard"
          [ "$(curl -s "${HA[@]}" $B/.status.json | node -pe 'const j=JSON.parse(require("fs").readFileSync(0,"utf8")); j.static.join(",")+"|"+j.apps.map(a=>a.slug).join(",")')" = "hello|api" ] || fail "alpha's status feed is wrong"
          # purge takes one tenant's folder, with that tenant's credential only
          [ "$(code -X POST -H 'X-Docklets-Tenant: alpha-site' -H "Authorization: Bearer $TB" $R/sync/purge)" = 401 ] || fail "purge accepted another tenant's token"
          [ "$(code -X POST -H 'X-Docklets-Tenant: alpha-site' -H "Authorization: Bearer $TA" $R/sync/purge)" = 200 ] || fail "purge refused the tenant's own token"
          [ "$(code "${HA[@]}" $B/hello/)" = 404 ] || fail "a purged tenant still serves"
          [ "$(curl -s "${HB[@]}" $B/hello/)" = "BRAVO HELLO" ] || fail "purging alpha touched bravo"
      - name: Teardown
        if: always()
        run: |
          docker rm -f dk-ci-pod-gw dk-ci-rt dk-ci-cell-gw dk-ci-cell dk-ci-cellstub 2>/dev/null || true
          docker network rm dk-ci-cellnet 2>/dev/null || true
          pkill -f 'frps -c /tmp/frps.toml' || true
